services:
  labia-chat:
    image: node:22-alpine
    container_name: labia-chat
    working_dir: /app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      VLLM_BASE_URL: ${VLLM_BASE_URL:-http://localhost:8000/v1}
      VLLM_API_KEY: ${VLLM_API_KEY:-labia-local-key}
      VLLM_MODEL_ID: ${VLLM_MODEL_ID:-qwen-coder-next}
    ports:
      - "${LABIA_CHAT_PORT:-3000}:3000"
    volumes:
      - ./:/app
      - labia-chat-node-modules:/app/node_modules
      - labia-chat-next:/app/.next
    command: >
      sh -c "npm ci --include=dev
      && npm run build
      && npm prune --omit=dev
      && npm run start -- -H 0.0.0.0 -p 3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:3000/api/health >/dev/null 2>&1 || exit 1"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  labia-chat-node-modules:
  labia-chat-next:
